<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Task status management logo</title>
  <desc id="desc">A clipboard with task status markers, progress flow, and dashboard chart.</desc>
  <defs>
